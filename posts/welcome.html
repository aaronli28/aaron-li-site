This is the first post. I'm using it partly as a low-stakes warm-up and partly

## Prose looks like this

You can write **bold**, *italic*, ~~struck through~~, or `inline code`. Links
work the usual way: [GitHub](https://github.com), [Codeforces](https://codeforces.com).
Paragraphs are separated by blank lines.

> Blockquotes look like this — for pull quotes, asides, or other people's words.
> Multiple lines fold into one block.

## Lists

Ordered:

1. The first thing
2. The second thing
3. The third thing

Unordered:

- Apples
- Oranges
- Other fruit

## A small table

| algorithm        | time         | space  |
|------------------|--------------|--------|
| binary search    | O(log n)     | O(1)   |
| merge sort       | O(n log n)   | O(n)   |
| segment tree     | O(log n)/op  | O(n)   |

## Code, with syntax

Code blocks are syntax-highlighted by `highlight.js`. Tag the language after
the opening fence:

```python
def fib(n, memo={}):
    if n in memo: return memo[n]
    if n < 2: return n
    memo[n] = fib(n - 1, memo) + fib(n - 2, memo)
    return memo[n]

print(fib(50))  # 12586269025
```

C++ works too:

```cpp
#include <bits/stdc++.h>
using namespace std;

int main() {
    int n; cin >> n;
    vector<long long> dp(n + 1, 0);
    dp[0] = 1;
    for (int i = 1; i <= n; i++)
        for (int j = i; j <= n; j++)
            dp[j] += dp[j - i];
    cout << dp[n] << "\n";   // p(n), the partition number
}
```

## Math

Inline math: Euler's identity, $e^{i\pi} + 1 = 0$, ties together five
fundamental constants in one statement.

Display math goes between double dollar signs:

$$
\zeta(s) = \sum_{n=1}^\infty \frac{1}{n^s}
$$

Bigger expressions render fine as well:

$$
\frac{\partial}{\partial t}\Psi(x, t)
\;=\; \frac{i\hbar}{2m}\frac{\partial^2}{\partial x^2}\Psi(x, t)
\;-\; \frac{i}{\hbar}\, V(x)\, \Psi(x, t)
$$

And the gist of a proof can sit inline with the prose:

> By induction on $n$: the base case $n = 1$ is immediate, and the inductive
> step follows because $\binom{n}{k} = \binom{n-1}{k-1} + \binom{n-1}{k}$.

## That's about it

If you can see all of the above rendered properly, the kit's complete.
Now I just need to actually write things.

     ===================================================================== -->
<script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

<script>
(() => {
  // ----------------------------------------------------------------------
  // Math protection: pull $...$ and $$...$$ out *before* markdown sees them
  // (so the markdown parser can't mangle underscores or asterisks inside
  // math), replace each with a placeholder, then render KaTeX into those
  // placeholders after markdown runs. Code fences (```) are skipped so dollar
  // signs inside code never get treated as math.
  // ----------------------------------------------------------------------
  function preprocessMath(src) {
    const math = [];
    let result = '';
    let i = 0;
    let inFence = false;

    while (i < src.length) {
      // fence boundary (``` at the start of a line)
      if ((i === 0 || src[i - 1] === '\n') && src.startsWith('```', i)) {
        const nl = src.indexOf('\n', i);
        const end = nl === -1 ? src.length : nl + 1;
        result += src.slice(i, end);
        i = end;
        inFence = !inFence;
        continue;
      }
      if (inFence) { result += src[i++]; continue; }

      // display math
      if (src.startsWith('$$', i)) {
        const end = src.indexOf('$$', i + 2);
        if (end !== -1) {
          math.push({ display: true, eq: src.slice(i + 2, end).trim() });
          result += '\x00M' + (math.length - 1) + '\x00';
          i = end + 2;
          continue;
        }
      }

      // inline math (single line, non-empty content)
      if (src[i] === '$') {
        const nl = src.indexOf('\n', i);
        const limit = nl === -1 ? src.length : nl;
        const end = src.indexOf('$', i + 1);
        if (end !== -1 && end < limit) {
          const eq = src.slice(i + 1, end);
          if (eq.trim().length > 0) {
            math.push({ display: false, eq });
            result += '\x00M' + (math.length - 1) + '\x00';
            i = end + 1;
            continue;
          }
        }
      }

      result += src[i++];
    }

    return { src: result, math };
  }

  // Configure markdown-it
  const md = window.markdownit({
    html: false,            // raw HTML in posts is disabled (safer)
    linkify: true,
    typographer: true,
    breaks: false,
    highlight: function (str, lang) {
      const escape = md.utils.escapeHtml;
      if (lang && hljs.getLanguage(lang)) {
        try {
          return '<pre class="hljs"><code>' +
            hljs.highlight(str, { language: lang, ignoreIllegals: true }).value +
            '</code></pre>';
        } catch (_) {}
      }
      return '<pre class="hljs"><code>' + escape(str) + '</code></pre>';
    }
  });

  // Grab raw source, pull math out, render markdown, inject math back
  const raw  = document.getElementById('post-source').textContent;
  const { src, math } = preprocessMath(raw);
  let html = md.render(src);

  html = html.replace(/\x00M(\d+)\x00/g, (_, idx) => {
    const m = math[+idx];
    try {
      return katex.renderToString(m.eq, {
        displayMode: m.display,
        throwOnError: false,
        output: 'html',
      });
    } catch (e) {
      return '<code>' + (m.display ? '$$' : '$') + md.utils.escapeHtml(m.eq) + (m.display ? '$$' : '$') + '</code>';
    }
  });

  document.getElementById('post-body').innerHTML = html;
})();
</script>
