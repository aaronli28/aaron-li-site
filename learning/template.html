  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}

  .note-page{max-width:720px;margin:0 auto;padding:3rem 1.75rem 6rem}
  .note-nav{display:flex;justify-content:space-between;align-items:center;

  .note-eyebrow::before{content:'';width:32px;height:1px;background:var(--accent)}
  .note-title{font-family:var(--serif);font-variation-settings:'SOFT' 100,'opsz' 144;

  .note-body>*:first-child{margin-top:0}
  .note-body p{margin:1.1em 0}
  .note-body h2{font-family:var(--serif);font-variation-settings:'SOFT' 100,'opsz' 48;

  .note-body h3{font-family:var(--serif);font-size:1.25rem;font-weight:440;margin:2em 0 .5em}
  .note-body a{color:var(--accent);text-decoration:underline;text-underline-offset:3px;

  .note-body a:hover{color:var(--purple)}

  .note-body ul,.note-body ol{margin:1.2em 0;padding-left:1.5em}
  .note-body li{margin:.35em 0}
  .note-body ul li::marker{color:var(--accent)}

  .note-body blockquote{border-left:2px solid var(--accent);margin:1.6em 0;

<script src="https://cdn.jsdelivr.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script>
(() => {
  const SEED  = Math.random().toString(36).slice(2, 9);
  const PH    = i => `XMATH${SEED}N${i}X`;
  const PH_RE = new RegExp(`XMATH${SEED}N(\\d+)X`, 'g');

  function preprocessMath(src) {
    const math = []; let result = '', i = 0, inFence = false;
    while (i < src.length) {
      if ((i === 0 || src[i-1] === '\n') && src.startsWith('```', i)) {
        const nl = src.indexOf('\n', i), end = nl === -1 ? src.length : nl + 1;
        result += src.slice(i, end); i = end; inFence = !inFence; continue;
      }
      if (inFence) { result += src[i++]; continue; }
      if (src.startsWith('$$', i)) {
        const end = src.indexOf('$$', i + 2);
        if (end !== -1) { math.push({display:true,eq:src.slice(i+2,end).trim()}); result+=PH(math.length-1); i=end+2; continue; }
      }
      if (src[i] === '$') {
        const nl = src.indexOf('\n', i), limit = nl===-1?src.length:nl;
        const end = src.indexOf('$', i + 1);
        if (end !== -1 && end < limit) {
          const eq = src.slice(i+1, end);
          if (eq.trim().length > 0) { math.push({display:false,eq}); result+=PH(math.length-1); i=end+1; continue; }
        }
      }
      result += src[i++];
    }
    return {src: result, math};
  }

  const md = window.markdownit({html:false,linkify:true,typographer:true,
    highlight:(str,lang) => {
      if (lang && hljs.getLanguage(lang)) try { return '<pre class="hljs"><code>'+hljs.highlight(str,{language:lang,ignoreIllegals:true}).value+'</code></pre>'; } catch(_){}
      return '<pre class="hljs"><code>'+md.utils.escapeHtml(str)+'</code></pre>';
    }
  });
  const raw = document.getElementById('note-source').textContent;
  const {src, math} = preprocessMath(raw);
  let html = md.render(src);
  html = html.replace(PH_RE, (_,idx) => {
    const m = math[+idx];
    try { return katex.renderToString(m.eq,{displayMode:m.display,throwOnError:false}); }
    catch(e) { return `<code>${m.display?'$$':'$'}${md.utils.escapeHtml(m.eq)}${m.display?'$$':'$'}</code>`; }
  });
  document.getElementById('note-body').innerHTML = html;
})();
</script>
